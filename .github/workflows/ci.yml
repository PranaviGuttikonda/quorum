name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cmake --version
          c++ --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Debug builds are several times slower, so they run fewer fuzz seeds.
        env:
          QUORUM_FUZZ_SEEDS: ${{ matrix.build_type == 'Debug' && '200' || '1000' }}
        run: ctest --test-dir build --output-on-failure
